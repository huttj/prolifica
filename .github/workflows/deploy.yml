name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# one deploy at a time, in push order
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # applies only the migrations that the remote database does not have yet
      - run: npm run db:migrate:remote
      - run: npm run deploy
